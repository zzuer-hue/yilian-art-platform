	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script type="text/javascript">
	window.onload=function(){
		$("#btn1").click(function () {
			let email = $('#email').val();
			let password = $('#password').val();
			let param = {
				password:password,
				username:email
			}
			console.log(param);
			var obj =JSON.stringify(param)
			$.ajax({
				url : 'http://192.168.2.88:8081/api/v1/user/login',
				data :obj,
				type:"POST",
				dataType:'json',
				contentType: 'application/json;charset=utf-8',
				success:function (res) {
					if(res.code==200){
						
						$(location).attr('href', 'index-logged in.html');
					}
					else{
						alert(res.message);
					}
				},
				error:function(){
            		alert("error");
        				}

			})
		})
	}






</script>
